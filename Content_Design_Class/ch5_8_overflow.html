<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>overflow 프로퍼티</title>
    <style>
        /* overflow의 속성값은
        hidden : 초과된 콘텐츠 잘라내서 안보이게
        visible(기본값) : 범위를 넘어서 보이게
        scroll : 초과된 콘텐츠를 볼 수 있게 스크롤 바 추가.
        auto : 초과된 콘텐츠가 있을 경우에만 스크롤 바 추가하고, 없으면 표시 x */
        p {
            width: 15em;
            height: 3em;
            border: 1px solid lightgray;
        }

        .hidden {
            overflow: hidden;
        }

        .visible {
            overflow: visible;
        }

        .scroll {
            overflow: scroll;
        }
    </style>

</head>

<body>
    <h3>overflow 프로퍼티</h3>
    <hr>
    <p class="hidden">overflow에 hidden 값을 적용하면
        박스를 넘어가는 내용이 잘려 보이지 않습니다.</p><br>
    <p class="visible">overflow에 visible 값을 적용하면
        콘텐트가 박스를 넘어가서도 출력됩니다</p><br>
    <p class="scroll">overflow에 scroll 값을 적용하면
        박스에 스크롤바를 붙여 출력합니다.</p>
</body>

</html>
