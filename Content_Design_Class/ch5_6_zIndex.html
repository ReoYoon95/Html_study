<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index 프로퍼티</title>
    <style>
        /*      
        z-index 값은 레이어로 생각하면 이해하기 쉽다.
        숫자가 낮을 수록 뒤쪽에 있는 레이어
        높을수록 앞쪽에 있는 레이어다. 
        추가로 z-index는 부모요소의 쌓임 컨텍스트 내에서만 영향을 미친다. 즉 같은 부모,같은레벨끼리만 영향을 미침.*/
        div {
            position: absolute;
        }

        img {
            position: absolute;
        }

        #spadeA {
            z-index: -3;
            left: 10px;
            top: 20px;
        }

        #spade2 {
            z-index: 2;
            left: 40px;
            top: 30px;
        }

        #spade3 {
            z-index: 3;
            left: 80px;
            top: 40px;
        }

        #spade7 {
            z-index: 7;
            left: 120px;
            top: 50px;
        }
    </style>

</head>

</head>

<body>
    <h3>z-index 프로퍼티</h3>
    <hr>
    <div>
        <img id="spadeA" src="media/spade-A.png" width="100" height="140" alt="스페이드A">
        <img id="spade2" src="media/spade-2.png" width="100" height="140" alt="스페이드2">
        <img id="spade3" src="media/spade-3.png" width="100" height="140" alt="스페이드3">
        <img id="spade7" src="media/spade-7.png" width="100" height="140" alt="스페이드7">
    </div>

</body>


</html>
