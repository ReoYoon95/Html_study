<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position 배치</title>

    <style>
        /* 포지션:relative 상대위치*/
        div {
            display: inline-block;
            height: 50px;
            width: 50px;
            border: 1px solid lightgray;
            text-align: center;
            color: white;
            background: red;
        }

        #down:hover {
            position: relative;
            left: 20px;
            top: 20px;
            background: green;
        }

        #up:hover {
            position: relative;
            right: 20px;
            bottom: 20px;
            background: green;
        }

        /* 포지션:absolute 절대 위치
         부모를 기준으로 이동. 부모 중에 position이 relative, fixed, absolute 하나라도 있으면  그 부모를 기준으로 절대적으로 움직이게 된다. */

        div {
            display: inline-block;
            position: absolute;
            /* 절대 배치 */
            border: 1px solid lightgray;
        }

        div>p {
            display: inline-block;
            /* div의 자식 p */
            position: absolute;
            /* 절대 배치 */
            height: 20px;
            width: 15px;
            background: lightgray;
        }

        /* 포지션: fixed  
        스크롤에 영향을 받지 않고 항상 동일한 위치에 고정되어 표시*/
        #fixed {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 100px;
            padding: 5px;
            background: red;
            color: white;
        }
    </style>

</head>

<body>
    <!-- 포지션:relative 연습 -->
    <h3>상대 배치, relative</h3>
    h와 k 글자에 마우스를 올려 보세요
    <hr>
    <div>T</div>
    <div id="down">h</div>
    <div>a</div>
    <div>n</div>
    <div id="up">k</div>
    <div>s</div>

    <!-- 포지션:absolute 연습 -->
    <h3>Merry Christmas!</h3>
    <hr>
    <p>예수님이 탄생하셨습니다.</p>
    <div>
        <img src="media/christmastree.png" width="200" height="200" alt="크리스마스 트리">
        <p style="left:50px; top:30px">M</p>
        <p style="left:100px; top:0px">E</p>
        <p style="left:100px; top:80px">R</p>
        <p style="left:150px; top:110px">R</p>
        <p style="left:30px; top:130px">Y</p>
    </div>

    <!-- 포지션:fixed 연습 -->
    <h3>Merry Christmas!</h3>
    <hr>
    <img src="media/christmastree.png" width="300" height="300" alt="크리스마스 트리">
    <div id="fixed">예수님이 탄생하셨습니다. </div>


</body>

</html>
