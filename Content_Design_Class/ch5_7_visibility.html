<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility 프로퍼티</title>
    <style>
        /* visibility(가시성)
        기본값은 visible이고, hidden으로 하면 화면에 보이지않고 숨겨지지만 레이아웃 공간은 유지,
        collapse는 테이블 행과 열을 숨길대 사용하고,레이아웃 공간도 제거. 일반요소에 collapse를 사용할 경우 hidden으로 적용*/
        span {
            visibility: hidden;
        }
    </style>
</head>

<body>
    <h3>다음 빈 곳에 숨은 단어?</h3>
    <hr>
    <ul>
        <li>I (<span>love</span>) you.
        <li>CSS is Cascading (<span>Style</span>) Sheet.
        <li>응답하라 (<span>1988</span>).
    </ul>
</body>

</html>
