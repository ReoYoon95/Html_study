<!DOCTYPE html>
<html lang="en">

<!-- 
id와 class 네이밍 규칙
1. 알파벳으로 시작(숫자금지)
2. 대문자 소문자 구별해야함
3. 띄어쓰기  금지
4. 특수문자는 _언더바 만 사용 
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS선택자</title>
    <style>
        h1 {
            color: tomato
        }

        h2 {
            color: #369;
        }

        .box1 {
            color: pink;
        }

        h1.box1 {
            color: green;
        }

        #logo {
            text-decoration: underline;
        }

        /* id는 #을 붙여서 쓴다. */
        .box1 p {
            color: red;
        }

        .box1 li {
            font-size: 20px;
        }

        .box1 div ul {
            background: yellow;
        }

        .box1 span {
            color: red;
        }

        .box1>.box2 {
            text-decoration: underline;
        }

        h1:hover {
            background: tomato;
        }

        /* hover는 마우스를 가져다대면 바뀜 */
        .box1 ul li:nth-child(2) {
            text-decoration: underline;
        }

        .box1 ul li:first-child {
            font-weight: bold;
        }

        /* 몇번째 애만 바꾸는 거 짝홀수도가능*/
        /* even odd 2n 2n+1 이렇게 표현할 수 있음 */
        .box3 li:nth-child(2n+1) {
            background: #ccc;
        }

        .box3 li:nth-child(even) {
            background: #fc6;
        }

        .box2 p:first-of-type {
            color: red;
        }

        .box1 p:last-of-type {
            font-size: 20px;
        }

        /* 자손은 띄어쓰기, 
        자식은 >를 사용 */
    </style>
</head>

<body>
    <h1 id="logo" class="box1">CSS선택자</h1>
    <div class="box1">
        <p>박스1</p>
        <p class="box2">박스2</p>
        <p>박스3</p>
        <div>
            <ul>
                <li><span>list-1</span></li>
                <li>list-2</li>
                <li>list-3</li>
            </ul>
        </div>
    </div>
    <div class="box2">
        <h2>CSS선택자2</h2>
        <p>박스2-1</p>
        <p>박스2-2</p>
        <p>박스2-3</p>
        <p class="box1">박스2-4</p>
    </div>

    <ul class="box3">
        <li><a href="#" target="_blank">네이버</a></li>
        <li><a href="#" class="button">버튼</a></li>
        <li><a href="#" title="us">버튼</a></li>
        <li><a href="#" title="english">영어</a></li>
        <li><a href="#">주민등록등본</a></li>
        <li><a href="http://www.daum.net">다음</a></li>
    </ul>

</body>

</html>
