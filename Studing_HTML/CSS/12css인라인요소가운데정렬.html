<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>text-align 인라인요소를 정렬</h2>
    <div class="box1">
        <p class="p1">
            text-align:left; 왼쪽정렬<br>
            <img src="../img/머리카락.jpg">
        </p>
        <p class="p2">text-align:center; 가운데정렬<br><img src="../img/머리카락.jpg"></p>
        <p class="p3">text-align:right; 오른쪽정렬<br><img src="../img/머리카락.jpg"></p>
    </div>
    <style>
        body {
            text-align: center;
            background: blue;
            color: red;
        }

        .box1 p img {
            width: 200px;
            height: 200px;
        }

        .box1 {
            background: #fcc;
        }

        .box1 p {
            background: #fc6;
        }

        .box1 .p1 {
            text-align: left;
        }

        .box1 .p2 {
            text-align: center;
        }

        .box1 .p3 {
            text-align: right;
        }
    </style>

</body>

</html>
