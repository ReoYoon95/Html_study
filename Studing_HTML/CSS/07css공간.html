<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>border-radius:둥근사각형</h2>
    <p class="box3">BOX3</p>
    <p class="box4"><img src="../img/머리카락.jpg"></p>
    <style>
        .box3 {
            width: 300px;
            height: 300px;
            background: skyblue;
            border-radius: 50%;
            /* 특정값을 넣어줘도 되고 %를 써서 해도 됌. */
            /* 원을 만들고 싶을때에는 높이 너비가 같을때 50% 또는 절반px을 설정 */
        }

        .box4 {
            width: 300px;
            height: 300px;
            background: pink;
            border-radius: 50%;
            overflow: hidden;
            /* 그릇을 넘처흐르는 것을 숨기는 옵션 */
        }
    </style>

</body>

</html>
