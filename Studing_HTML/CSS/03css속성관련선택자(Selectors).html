<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul class="box3">
        <li><a href="#" target="_blank">네이버</a></li>
        <li><a href="#" class="button">버튼</a></li>
        <li><a href="#" title="us">버튼</a></li>
        <li><a href="#" title="english">영어</a></li>
        <li><a href="주민등록등본.hwp">주민등록등본</a></li>
        <li><a href="인감증명서.txt">인감증명서</a></li>
        <li><a href="http://www.daum.net">다음</a></li><s></s>
        <!-- href="#" -> 맨위로 이동해라 -->
    </ul>
    <style>
        .box3 a[target]{color: black;}
        .box3 a[class]{color: black;}
        .box3 a[title="us"]{columns: black;}
        .box3 a[href$="hwp"]{text-decoration: none;}
        /* $ -> ~~로 끝나는 */
        .box3 a[href*="daum"]{text-decoration: none;}
        /* * -> ~~를 포함하는 */
        .box3 a[title^="en"]{text-decoration: none;}
        /* ^ -> ~~로 시작하는 */
        
        .box3 a[href$="hwp"], .box3 a[href$="txt"]{background: purple;}

        *{margin: 0; padding: 0}
        /* *는 모든태그를 선택. */
    </style>

</body>

</html>
