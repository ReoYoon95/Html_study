<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공간</title>
</head>

<body>

    <!-- margin은 바깥쪽여백, padding은 안쪽여백을 더 주는거임. -->
    <h2>공간</h2>
    <p
        style="background: #fc6; width: 200px; height: 200px; margin-bottom: 30px; margin-top: 50px; margin-left: 40px; margin-right: 20px;">
        BOX1</p>
    <p style="background: #fcc; width: 200px; height: 200px; margin:50px 40px 30px 20px">BOX2</p>
    <!-- margin:a, b, c, d a->d순으로 12시부터 시계방향으로 움직임. -->
    <p style="background: #fca; width: 200px; height: 200px; margin:50px 0">BOX3</p>
    <!-- magin:a, b   맨위 아래는 a 양옆은 b로  -->
    <!-- magin:a, b, c  맨위는 a 오른쪽은 b 아래는 c-->
    <hr>
    <h2>공간</h2>

    <p style="background: #fca; width: 200px; height: 200px; 
    padding-top: 50px; padding-bottom: 20px; padding-left: 30px;">BOX4</p>

    <p style="background: #2ca; width: 200px; height: 200px; padding: 50px 30px 40px 10px">BOX5</p>
</body>

</html>
