<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS사용방법</title>
    <link href="style01.css" rel="stylesheet">
    <style>
        p {
            font-weight: bold;
            color: blue;
        }

        /* 2번방법 */
        /* css작성방법은 선택자{css속성:속성값; css속성:속성값;} */
    </style>

</head>

<body>
    <h1 style="background:yellow; color:red">CSS사용방법</h1> <!-- 1번 방법-->
    <p>1. 직접 태그에 스타일을 적용하는 방법</p>
    <p>2. html문서에서 &lt;style&gt;태그를 만들어서 스타일을 적용하는 방법 </p>
    <p class="point">3. css문서에 style속성 지정하는 방법</p>
    <!-- 링크와 임포트를 동시에 하지 않도록 주의 -->


</body>

</html>
