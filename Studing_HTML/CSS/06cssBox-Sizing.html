<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공간</title>
</head>

<body>
    <h2>공간</h2>
    <p
        style="background: #fc6; width: 200px; height: 200px; margin-bottom: 30px; margin-top: 50px; margin-left: 40px; margin-right: 20px;">
        BOX1</p>
    <p style="background: #fca; width: 200px; height: 200px; 
    padding-top: 50px; padding-bottom: 20px; padding-left: 30px;">BOX4</p>

    <h2>Box-Sizing</h2>
    <p style="width:200px; background: #fcc; height:100px; padding:30px; box-sizing: border-box;">box-sizing</p>
    <p style="width:200px; background: #fcc; height:100px; padding:30px;  box-sizing: content-box;">box-sizing</p>
    <!-- box-sizing을 border-box로 하면 테두리까지 다 합쳐서의 사이즈로 생성되고 (최종박스크기), content-box(기본값)로 설정하면 패딩 테두리가 적용된 사이즈로 된다. -->

</body>

</html>
